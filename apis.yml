name: Diamondback Energy
description: >-
  Diamondback Energy is an independent oil and natural gas company focused on the
  acquisition, development, exploration, and exploitation of unconventional, onshore
  oil and natural gas reserves in the Permian Basin of West Texas. As a Fortune 500
  company in the upstream energy sector, Diamondback publishes no developer portal,
  no API, and no machine-readable contract of any kind; its entire web presence is a
  Q4/gcs-web investor-relations site, and owner joint-interest billing and revenue
  check detail are delivered through the third-party EnergyLink portal rather than a
  first-party interface. The only machine-readable surfaces it serves are three RSS
  feeds on the IR platform — news releases, events and SEC filings. This repository
  is maintained as a placeholder for any APIs, developer tools, or machine-readable
  artifacts that may emerge.
